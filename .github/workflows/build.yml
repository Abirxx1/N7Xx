name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q N7X-FPS-Unlocker.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: cd N7X && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: N7X-debug-apk
          path: N7X/app/build/outputs/apk/debug/app-debug.apk
